<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#185038" />
    <title>Fermi Trade</title>
    <meta
      name="description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />

    <!-- Open Graph / Twitter. One build serves fermi.trade and app.fermi.trade,
         so both share these; the image URL is absolute for crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fermi Trade" />
    <meta property="og:url" content="https://fermi.trade" />
    <meta property="og:title" content="Fermi Trade - Instant finality. Capital efficient." />
    <meta
      property="og:description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />
    <meta property="og:image" content="https://fermi.trade/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fermi Trade: Instant finality. Capital efficient." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FermiLabs" />
    <meta name="twitter:title" content="Fermi Trade - Instant finality. Capital efficient." />
    <meta
      name="twitter:description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />
    <meta name="twitter:image" content="https://fermi.trade/og.jpg" />
    <meta name="twitter:image:alt" content="Fermi Trade: Instant finality. Capital efficient." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/logo-square-light.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted mono font, used across the trading UI -->
    <link rel="preload" href="/fonts/PaperMono-VF.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect to Google Fonts domains for faster connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch as fallback for older browsers -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QP43KSLRBC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QP43KSLRBC');
    </script>
    <!-- Boot splash: shown until React mounts and replaces #root, so a cold
         load (e.g. right after a deploy) isn't a blank page. Colors are inline
         because index.css hasn't loaded yet. The landing page (/ off the app
         host) is forest green like its own splash; the app is --color-background. -->
    <script>
      if (location.pathname !== '/' || location.hostname === 'app.fermi.trade') {
        document.documentElement.dataset.boot = 'app';
      }
    </script>
    <style>
      html { background: #185038; }
      html[data-boot='app'] { background: #011812; }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #f8f7e7;
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 300;
        font-size: 30px;
        letter-spacing: -0.025em;
      }
      #boot-splash img { width: 48px; height: 48px; animation: boot-pulse 2s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="/logo.svg" alt="" />
        <span>Fermi Trade</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
