<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001409" />
    <title>Fermi Trade</title>
    <meta
      name="description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />

    <!-- Open Graph / Twitter. One build serves fermi.trade and app.fermi.trade,
         so both share these; the image URL is absolute for crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fermi Trade" />
    <meta property="og:url" content="https://fermi.trade" />
    <meta property="og:title" content="Fermi Trade - Instant finality. Capital efficient." />
    <meta
      property="og:description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />
    <meta property="og:image" content="https://fermi.trade/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fermi Trade: Instant finality. Capital efficient." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FermiLabs" />
    <meta name="twitter:title" content="Fermi Trade - Instant finality. Capital efficient." />
    <meta
      name="twitter:description"
      content="Perpetuals on Solana with instant finality. A fair FIFO orderbook: no mempool, no MEV, no front-running."
    />
    <meta name="twitter:image" content="https://fermi.trade/og.jpg" />
    <meta name="twitter:image:alt" content="Fermi Trade: Instant finality. Capital efficient." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/logo-square-light.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted mono font, used across the trading UI -->
    <link rel="preload" href="/fonts/PaperMono-VF.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect to Google Fonts domains for faster connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Archivo (splash wordmark) and Newsreader load here rather than from
         index.css so the boot splash can use them before the bundle arrives.
         Non-blocking: print-media swap. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Newsreader:opsz,wght@6..72,300..600&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- DNS prefetch as fallback for older browsers -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QP43KSLRBC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QP43KSLRBC');
    </script>
    <!-- Boot splash: shown until the first route has rendered (see
         src/shared/lib/boot-splash.ts), so a cold load (e.g. right after a
         deploy) isn't a blank page. Colors are inline
         because index.css hasn't loaded yet; every page is --color-background. -->
    <style>
      /* Paper Mono (OFL 1.1, https://github.com/paper-design/paper-mono).
         Declared here, not in index.css, so the boot splash can use it. */
      @font-face {
        font-family: 'Paper Mono';
        src: url('/fonts/PaperMono-VF.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }
      html { background: #001409; }
      /* Sits outside #root so React mounting can't cut it off; src/shared/lib/
         boot-splash.ts removes it once the first route has rendered.
         Timing: invisible for 150ms, then everything appears at once, so a warm
         load never sees it and there is never a half-built frame. Once shown it
         stays >= 400ms, then fades. All motion is opacity/transform only. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f8f7e7;
        text-align: center;
        /* Same as the page, so fading out reveals no seam */
        background: #001409;
        animation: boot-in 0.15s ease-out 0.15s both;
      }
      /* Both directions are animations: a transition can't start from an
         animated value, so it would snap instead of fading. */
      .boot-splash.is-done { animation: boot-out 0.28s ease both; pointer-events: none; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-out { to { opacity: 0; } }
      /* The UFO scene from the landing page's call to action, drawn by the
         inline script below so it runs before the app bundle loads: one canvas
         cell per 3 CSS pixels, upscaled nearest-neighbour. */
      .boot-splash__ufo {
        width: 288px;
        height: 216px;
        margin-bottom: 20px;
        image-rendering: pixelated;
      }
      .boot-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 6vh;
      }
      .boot-splash__eyebrow {
        margin: 0 0 18px;
        font: 400 12px/1 'Paper Mono', ui-monospace, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(248, 247, 231, 0.6);
      }
      .boot-splash__wordmark {
        margin: 0;
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(44px, 7vw, 76px);
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" class="boot-splash" aria-hidden="true">
      <div class="boot-splash__content">
        <canvas id="boot-ufo" class="boot-splash__ufo" width="96" height="72"></canvas>
        <p class="boot-splash__eyebrow">Perpetuals on Solana</p>
        <p class="boot-splash__wordmark">Fermi Trade</p>
      </div>
    </div>
    <script>
      // Boot splash scene: a saucer beams up an alien on a loop. A compact copy
      // of src/pages/home/lib/alien-field.ts (same sprites and tones), inline so
      // it plays while the app bundle is still downloading. Stops once
      // boot-splash.ts removes the splash.
      (function () {
        var canvas = document.getElementById('boot-ufo');
        var ctx = canvas && canvas.getContext('2d');
        if (!ctx) return;
        var W = 96, H = 72, GROUND = 64;
        var LICHEN = [null, [8, 40, 26], [20, 66, 44], [72, 138, 84], [180, 220, 120]];
        var AMBER = [null, [16, 40, 22], [56, 72, 36], [140, 132, 72], [253, 230, 138]];
        var STAR = [null, [24, 52, 38], [96, 110, 96], [210, 210, 196]];
        var ROCK = [248, 247, 231];
        var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        var UFO = ['........AAAAAAA........', '......AAAAAAAAAAA......', '.....AAAAAAAAAAAAA.....',
          '..LLLLLLLLLLLLLLLLLLL..', 'LLLLLLLLLLLLLLLLLLLLLLL', 'LL.o..o..o..o..o..o..LL',
          'LLLLLLLLLLLLLLLLLLLLLLL', '...LLLLLLLLLLLLLLLLL...'];
        var CRAB = [['..#.....#..', '...#...#...', '..#######..', '.##.###.##.', '###########', '#.#######.#', '#.#.....#.#', '...##.##...'],
          ['..#.....#..', '#..#...#..#', '#.#######.#', '###.###.###', '###########', '.#########.', '..#.....#..', '.#.......#.']];
        var SQUID = [['...##...', '..####..', '.######.', '##.##.##', '########', '..#..#..', '.#.##.#.', '#.#..#.#'],
          ['...##...', '..####..', '.######.', '##.##.##', '########', '.#.##.#.', '#......#', '.#....#.']];
        var STARS = [[6, 6], [20, 14], [33, 4], [70, 8], [86, 18], [12, 30], [80, 34], [90, 4], [4, 46], [91, 50]];
        var img = ctx.createImageData(W, H);
        var d = img.data;

        function level(v, n, x, y) {
          var t = Math.min(1, Math.max(0, v)) * n, lo = Math.floor(t);
          return Math.min(n, lo + (t - lo > (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16 ? 1 : 0));
        }
        function put(x, y, c) {
          if (!c || x < 0 || y < 0 || x >= W || y >= H) return;
          var i = (y * W + x) * 4;
          d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
        }

        // One loop: walk in, get lifted, a beat of flashing lights
        var WALK = 80, LIFT = 90, REST = 40, LOOP = WALK + LIFT + REST;
        function draw(t) {
          d.fill(0);
          var cx = 48 + Math.sin(t * 0.012) * 4;
          var uy = 6 + Math.sin(t * 0.05) * 1.5;
          var hull = uy + 16;
          var k = t % LOOP, round = Math.floor(t / LOOP);
          var sprite = round % 2 ? SQUID : CRAB;
          var fromLeft = round % 2 === 0;
          var sw = sprite[0][0].length, sh = sprite[0].length;
          var x, y, v;

          for (var s = 0; s < STARS.length; s++) {
            v = 0.5 + 0.5 * Math.sin(s * 1.7 + t * (0.02 + s * 0.004));
            put(STARS[s][0], STARS[s][1], STAR[Math.round(v * 3)]);
          }
          // Halo and beam
          var lifting = k >= WALK && k < WALK + LIFT;
          var pulse = 0.85 + 0.15 * Math.sin(t * 0.08) + (lifting ? 0.12 : 0);
          for (y = Math.max(0, Math.floor(uy - 6)); y <= GROUND; y++) {
            for (x = 0; x < W; x++) {
              var hx = (x - cx) / 30, hy = (y - (uy + 8)) / 14;
              v = 0.3 * Math.max(0, 1 - Math.hypot(hx, hy));
              if (y > hull) {
                var f = (y - hull) / (GROUND - hull), half = 7 + f * 12, dd = Math.abs(x - cx) / half;
                if (dd < 1) {
                  var scan = (((y - t * 0.4) % 8) + 8) % 8 < 2 ? 0.14 : 0;
                  v = Math.max(v, (0.5 - 0.28 * f + scan) * Math.min(1, (1 - dd) * 2.2) * pulse);
                }
              }
              if (v > 0) put(x, y, LICHEN[level(v, 3, x, y)]);
            }
          }
          for (x = 0; x < W; x += 2) put(x, GROUND + 1, [44, 70, 56]);

          // The alien: walks to the beam, then rises into the hull
          if (k < WALK + LIFT) {
            var startX = fromLeft ? 4 : W - sw - 4, endX = cx - sw / 2;
            var ax, ay, fade = 1;
            if (k < WALK) {
              ax = startX + (endX - startX) * (k / WALK);
              ay = GROUND - sh;
            } else {
              var p = (k - WALK) / LIFT, e = p * p * (3 - 2 * p);
              ax = endX;
              ay = GROUND - sh + (hull - (GROUND - sh)) * e;
              fade = 1 - p * 0.6;
            }
            var frame = sprite[Math.floor(t / 14) % 2];
            for (var r = 0; r < sh; r++)
              for (var c = 0; c < sw; c++)
                if (frame[r][c] === '#') {
                  x = Math.round(ax) + c; y = Math.round(ay) + r;
                  put(x, y, (round % 3 === 1 ? AMBER : LICHEN)[level(fade, 4, x, y)]);
                }
          }

          // Saucer, each sprite pixel as 2x2 dithered cells
          var ox = Math.round(cx - 23), oy = Math.round(uy);
          var flash = k >= WALK + LIFT && Math.floor((k - WALK - LIFT) / 6) % 2 === 0;
          for (var cy = 0; cy < 16; cy++)
            for (var cc = 0; cc < 46; cc++) {
              var rr = cy >> 1, col = cc >> 1, ch = UFO[rr][col];
              if (ch === '.') continue;
              x = ox + cc; y = oy + cy;
              if (ch === 'A') put(x, y, AMBER[level(0.55 + 0.35 * (1 - rr / 3) + 0.15 * (col / 23), 4, x, y)]);
              else if (ch === 'L') put(x, y, LICHEN[level([0, 0, 0, 0.92, 0.82, 0.74, 0.64, 0.5][rr], 4, x, y)]);
              else {
                var on = k >= WALK + LIFT ? flash : (Math.floor(t / 8) + Math.floor(col / 3)) % 3 === 0;
                put(x, y, on ? ROCK : AMBER[2]);
              }
            }
          ctx.putImageData(img, 0, 0);
        }

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          draw(WALK + 40);
          return;
        }
        var start = 0;
        function loop(now) {
          if (!document.getElementById('boot-splash')) return;
          if (!start) start = now;
          draw(Math.floor(((now - start) / 1000) * 60));
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
